steps:
  # 1. Install dependencies AND run Pytest tests
  - name: 'python:3.10'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --upgrade pip
        pip install -r requirements.txt pytest
        python -m pytest -v

  # 2. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/agentic-cicd-app:latest', '.']

  # 3. Push the Docker image to Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/agentic-cicd-app:latest']

  # 4. Deploy to Cloud Run (Mumbai Region)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'agentic-cicd-service'
      - '--image=gcr.io/$PROJECT_ID/agentic-cicd-app:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'

  # 5. Log Build directly to BigQuery (Mumbai Dataset)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        bq --location=asia-south1 query --use_legacy_sql=false \
        "INSERT INTO \`$PROJECT_ID.cicd_metrics.build_logs\` (build_id, status, build_time, duration, trigger_id) 
         VALUES ('$BUILD_ID', 'SUCCESS', CURRENT_TIMESTAMP(), '120s', 'manual-trigger')"

images:
  - 'gcr.io/$PROJECT_ID/agentic-cicd-app:latest'
